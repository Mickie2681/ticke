version: '3.8'

services:
  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ticket-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=myticket.settings
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgresql://ticket_user:ticket_pass@db:5432/ticket_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./myticket:/app/myticket
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - ticket-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ticket-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - ticket-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ticket-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ticket_db
      - POSTGRES_USER=ticket_user
      - POSTGRES_PASSWORD=ticket_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ticket-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ticket-network

  # Celery Worker (for background tasks)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ticket-celery
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=myticket.settings
      - DATABASE_URL=postgresql://ticket_user:ticket_pass@db:5432/ticket_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./myticket:/app/myticket
    depends_on:
      - db
      - redis
    command: celery -A myticket worker --loglevel=info
    networks:
      - ticket-network

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ticket-celery-beat
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=myticket.settings
      - DATABASE_URL=postgresql://ticket_user:ticket_pass@db:5432/ticket_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./myticket:/app/myticket
    depends_on:
      - db
      - redis
    command: celery -A myticket beat --loglevel=info
    networks:
      - ticket-network

  # Flower (Celery monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    container_name: ticket-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery
    command: celery -A myticket flower --port=5555
    networks:
      - ticket-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ticket-network:
    driver: bridge

